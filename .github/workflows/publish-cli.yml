name: Publish CLI

on:
  push:
    tags:
      - 'cli-v*'

permissions:
  contents: read

concurrency:
  group: publish-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@11
      - name: Check release tag
        run: |
          version="$(node -p "require('./packages/cli/package.json').version")"
          test "$GITHUB_REF_NAME" = "cli-v$version" || { echo '::error::Tag does not match CLI version'; exit 1; }
      - run: bun install --frozen-lockfile
      - run: bun run check:packages
      - run: bun test packages/core/test
      - run: bun run --cwd packages/cli test
      - name: Pack and verify the installable CLI
        run: |
          mkdir -p "$RUNNER_TEMP/cardstock-pack"
          npm pack ./packages/cli --pack-destination "$RUNNER_TEMP/cardstock-pack"
          npm install --global "$RUNNER_TEMP"/cardstock-pack/*.tgz
          version="$(node -p "require('./packages/cli/package.json').version")"
          test "$(cardstock --version)" = "$version"
          test "$(cardstock -v)" = "$version"
          if cardstock sync; then echo '::error::Unconfigured sync succeeded'; exit 1; fi
          CARDSTOCK_TEST_ENTRY="$(npm root -g)/@guinetik/cardstock-cli/dist/index.js" node --test packages/cli/test/cli.test.mjs packages/cli/test/new.test.mjs packages/cli/test/preview.test.mjs packages/cli/test/sync.test.mjs
      - name: Publish verified tarball through npm OIDC
        run: npm publish "$RUNNER_TEMP"/cardstock-pack/*.tgz --access public
