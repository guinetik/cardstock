<!-- @dsCard group="Spacing" viewport="700x160" name="Spacing" subtitle="The rem steps the app actually uses" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:14px 18px;background:var(--surface-page);color:var(--color-ink)}.cap{font-family:var(--font-mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--color-grey-faint)}.hex{font-family:var(--font-mono);font-size:9.5px;color:var(--color-grey)}.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}.s{display:flex;align-items:flex-end;gap:10px}.sb{background:var(--color-ink);height:14px}.sl{font-family:var(--font-mono);font-size:9px;color:var(--color-grey);margin-top:5px;white-space:nowrap}</style>
</head><body><div class="s">
<div><div class="sb" style="width:2px"></div><p class="sl">2px</p></div><div><div class="sb" style="width:4px"></div><p class="sl">4px</p></div><div><div class="sb" style="width:6px"></div><p class="sl">6px</p></div><div><div class="sb" style="width:8px"></div><p class="sl">8px</p></div><div><div class="sb" style="width:10px"></div><p class="sl">10px</p></div><div><div class="sb" style="width:12px"></div><p class="sl">12px</p></div><div><div class="sb" style="width:16px"></div><p class="sl">16px</p></div><div><div class="sb" style="width:24px"></div><p class="sl">24px</p></div><div><div class="sb" style="width:32px"></div><p class="sl">32px</p></div>
</div>
<p style="margin-top:14px;font-size:12.5px;color:var(--color-ink2)">Lanes and cards sit 8px apart; a card's own padding is 10px. The page gutter is 24px, the section break 32px.</p>
<p class="cap" style="margin-top:6px">Naming is an addition — cardstock has no spacing token file, only Tailwind's steps.</p></body></html>
