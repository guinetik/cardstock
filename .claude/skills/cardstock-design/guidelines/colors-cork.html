<!-- @dsCard group="Colors" viewport="700x160" name="Cork & post-it" subtitle="The calendar's corkboard and its canary slips" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:14px 18px;background:var(--surface-page);color:var(--color-ink)}.cap{font-family:var(--font-mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--color-grey-faint)}.hex{font-family:var(--font-mono);font-size:9.5px;color:var(--color-grey)}.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}.ck{padding:10px;background-color:var(--surface-cork);background-image:radial-gradient(var(--cork-speck) 1px,transparent 1.5px),radial-gradient(var(--cork-speck) 1px,transparent 1.5px);background-size:11px 11px,7px 7px;background-position:0 0,4px 6px;border:1px solid var(--border-strong);border-radius:var(--radius-card);box-shadow:var(--shadow-well);display:flex;gap:8px;align-items:flex-start}</style>
</head><body><div class="ck">
<div class="calendar-day" style="width:96px"><div class="calendar-day-body"><span class="calendar-day-num">12</span>
<div class="calendar-pack">
<article class="paper-card paper-card--static calendar-slip calendar-slip--stub" style="--slip-tilt:-2deg"><span class="calendar-slip-id">#10</span></article>
<article class="paper-card paper-card--static calendar-slip calendar-slip--stub card-color--amber" style="--slip-tilt:1.5deg"><span class="calendar-slip-id">#3</span></article>
</div></div></div>
<span class="calendar-dow">mon</span><span class="calendar-dow">tue</span>
<div style="flex:1;display:grid;gap:4px">
<span class="hex">--surface-cork #d9c09c</span><span class="hex">--cork-speck rgb(97 74 44 / .14)</span><span class="hex">--surface-postit #f9efb7</span>
</div>
</div>
<p class="cap" style="margin-top:10px">Weekday names are masking tape: torn ends, hand-placed tilt, the speckle ghosting through.</p></body></html>
