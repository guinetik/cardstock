<!-- @dsCard group="Type" viewport="700x230" name="Newsreader — the printed page" subtitle="Titles only; h1-h3 pick it up" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:14px 18px;background:var(--surface-page);color:var(--color-ink)}.cap{font-family:var(--font-mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--color-grey-faint)}.hex{font-family:var(--font-mono);font-size:9.5px;color:var(--color-grey)}.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}.sp{font-family:var(--font-display);font-weight:var(--display-weight);letter-spacing:var(--display-tracking);line-height:1.15;color:var(--color-ink-strong);margin:0}</style>
</head><body><p class="sp" style="font-size:36px">Projects <span class="hex" style="letter-spacing:0">36px</span></p>
<p class="sp" style="font-size:27px;margin-top:8px">Product backlog <span class="hex" style="letter-spacing:0">27px</span></p>
<p class="sp" style="font-size:22px;margin-top:8px">Take the folder home <span class="hex" style="letter-spacing:0">22px</span></p>
<p class="sp" style="font-size:18px;margin-top:8px">Needs attention <span class="hex" style="letter-spacing:0">18px</span></p>
<p class="cap" style="margin-top:12px">Newsreader 500 · tracking −0.012em · leading 1.15 — used where something is <em>titled</em>, nowhere else</p></body></html>
