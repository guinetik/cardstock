<!-- @dsCard group="Colors" viewport="700x170" name="Stock" subtitle="Five papers in a fixed stacking order" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:14px 18px;background:var(--surface-page);color:var(--color-ink)}.cap{font-family:var(--font-mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--color-grey-faint)}.hex{font-family:var(--font-mono);font-size:9.5px;color:var(--color-grey)}.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}.stack{display:flex;gap:0}.pl{flex:1;height:96px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;border:1px solid var(--border-hairline);border-right:0}.pl:last-child{border-right:1px solid var(--border-hairline)}.pl b{font-size:11px;font-weight:600}.pl .hex{margin-top:1px}</style>
</head><body><div class="stack">
<div class="pl" style="background:var(--surface-page)"><b>page</b><span class="hex">#f2eee6 · the desk</span></div>
<div class="pl" style="background:var(--surface-panel)"><b>panel</b><span class="hex">#ebe7dd · a lane on it</span></div>
<div class="pl" style="background:var(--surface-card)"><b>card</b><span class="hex">#fcfbf8 · a sheet</span></div>
<div class="pl" style="background:var(--surface-well);box-shadow:var(--shadow-well)"><b>well</b><span class="hex">#dcd5c3 · cut in</span></div>
<div class="pl" style="background:var(--surface-raised)"><b>raised</b><span class="hex">#ffffff · fields</span></div>
</div>
<p class="cap" style="margin-top:10px">Every lane paints its own stock — an empty lane is a place, never a hole.</p></body></html>
