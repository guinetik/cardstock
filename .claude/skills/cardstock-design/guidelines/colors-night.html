<!-- @dsCard group="Colors" viewport="700x170" name="Paper night" subtitle="The same desk under a lamp — warm graphite, not an inversion" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:14px 18px;background:var(--surface-page);color:var(--color-ink)}.cap{font-family:var(--font-mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--color-grey-faint)}.hex{font-family:var(--font-mono);font-size:9.5px;color:var(--color-grey)}.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}.stack{display:flex;gap:0}.pl{flex:1;height:88px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;border:1px solid var(--border-hairline);border-right:0}.pl:last-child{border-right:1px solid var(--border-hairline)}.pl b{font-size:11px;font-weight:600}</style>
</head><body><div data-theme="paper-night" style="background:var(--surface-page);padding:12px;border-radius:var(--radius-card)">
<div class="stack">
<div class="pl" style="background:var(--surface-page)"><b>page</b><span class="hex">#191713</span></div>
<div class="pl" style="background:var(--surface-panel)"><b>panel</b><span class="hex">#1e1c17</span></div>
<div class="pl" style="background:var(--surface-card)"><b>card</b><span class="hex">#23201a</span></div>
<div class="pl" style="background:var(--surface-well);box-shadow:var(--shadow-well)"><b>well</b><span class="hex">#100f0c</span></div>
<div class="pl" style="background:var(--surface-raised)"><b>raised</b><span class="hex">#2c2921</span></div>
</div>
<div class="row" style="margin-top:12px">
<span class="mark mark--2">Billing</span><span class="mark mark--4">Onboarding</span>
<span class="sq sq--on sq--red">P1</span><span class="stat stat--wip">wip</span>
<span style="font-size:12.5px;color:var(--color-ink2)">Set <code style="font-size:11px">data-theme="paper-night"</code>. The highlighter drops its multiply blend.</span>
</div>
</div></body></html>
