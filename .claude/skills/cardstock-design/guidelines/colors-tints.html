<!-- @dsCard group="Colors" viewport="700x150" name="Card tints" subtitle="Nine pastels a sheet can carry from its frontmatter" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:14px 18px;background:var(--surface-page);color:var(--color-ink)}.cap{font-family:var(--font-mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--color-grey-faint)}.hex{font-family:var(--font-mono);font-size:9.5px;color:var(--color-grey)}.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}.t{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:6px}.tc{height:52px;border:1px solid var(--border-hairline);border-radius:var(--radius-card);box-shadow:var(--shadow-card)}.tn{margin-top:5px;font-family:var(--font-mono);font-size:9px;color:var(--color-grey);text-align:center}</style>
</head><body><div class="t">
<div><div class="tc" style="background:var(--surface-card-rose)"></div><p class="tn">rose</p></div><div><div class="tc" style="background:var(--surface-card-orange)"></div><p class="tn">orange</p></div><div><div class="tc" style="background:var(--surface-card-amber)"></div><p class="tn">amber</p></div><div><div class="tc" style="background:var(--surface-card-green)"></div><p class="tn">green</p></div><div><div class="tc" style="background:var(--surface-card-cyan)"></div><p class="tn">cyan</p></div><div><div class="tc" style="background:var(--surface-card-blue)"></div><p class="tn">blue</p></div><div><div class="tc" style="background:var(--surface-card-indigo)"></div><p class="tn">indigo</p></div><div><div class="tc" style="background:var(--surface-card-violet)"></div><p class="tn">violet</p></div><div><div class="tc" style="background:var(--surface-card-pink)"></div><p class="tn">pink</p></div>
</div>
<p style="margin-top:12px;font-size:12.5px;color:var(--color-ink2)">A tint is <b>paper</b>, not a pen: it says nothing about priority or state. Lanes take the same nine.</p></body></html>
