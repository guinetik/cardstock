<!-- @dsCard group="Colors" viewport="700x150" name="Ink" subtitle="One warm-black ramp; text is ink, never a colour" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:14px 18px;background:var(--surface-page);color:var(--color-ink)}.cap{font-family:var(--font-mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--color-grey-faint)}.hex{font-family:var(--font-mono);font-size:9.5px;color:var(--color-grey)}.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}.ink{display:flex;gap:0}.ic{flex:1;padding:10px 8px;border-top:3px solid currentColor}.ic b{display:block;font-size:12px;font-weight:600}</style>
</head><body><div class="ink">
<div class="ic" style="color:var(--color-ink-strong)"><b>ink-strong</b><span class="hex">#100e0b · headings</span></div>
<div class="ic" style="color:var(--color-ink)"><b>ink</b><span class="hex">#1b1915 · body, keys</span></div>
<div class="ic" style="color:var(--color-ink2)"><b>ink2</b><span class="hex">#454039 · prose, notes</span></div>
<div class="ic" style="color:var(--color-grey)"><b>grey</b><span class="hex">#726b60 · labels</span></div>
<div class="ic" style="color:var(--color-grey-faint)"><b>grey-faint</b><span class="hex">#a09889 · ids, eyebrows</span></div>
</div>
<p style="margin-top:12px;font-size:13px;color:var(--color-ink2)">The primary action is ink, not a colour. Pen blue is for links and P2 only.</p></body></html>
