<!-- @dsCard group="Colors" viewport="700x160" name="Highlighter" subtitle="The reader's own hand — tags, and nothing else" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:14px 18px;background:var(--surface-page);color:var(--color-ink)}.cap{font-family:var(--font-mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--color-grey-faint)}.hex{font-family:var(--font-mono);font-size:9.5px;color:var(--color-grey)}.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}.marks{display:flex;flex-wrap:wrap;gap:8px}.hues{display:flex;gap:0;margin-top:14px}.h{flex:1;height:26px}</style>
</head><body><div class="marks">
<span class="mark mark--2">Billing</span><span class="mark mark--4">Onboarding</span><span class="mark mark--3">Reports</span>
<span class="mark mark--5">Cross-cutting</span><span class="mark mark--1">Blocker</span><span class="mark mark--2 mark--off">Unassigned</span>
</div>
<div class="hues">
<span class="h" style="background:var(--mark-2)"></span><span class="h" style="background:var(--mark-4)"></span>
<span class="h" style="background:var(--mark-3)"></span><span class="h" style="background:var(--mark-5)"></span>
<span class="h" style="background:var(--mark-1)"></span>
</div>
<p class="cap" style="margin-top:8px">Group order: amber, blue, green, violet, red — red last, so a red mark stays rare.</p>
<p style="margin-top:6px;font-size:12.5px;color:var(--color-ink2)">Multiplied over the stock. Never on the same element as a pen.</p></body></html>
