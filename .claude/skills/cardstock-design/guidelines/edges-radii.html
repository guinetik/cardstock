<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:14px 18px;background:var(--surface-page);color:var(--color-ink)}.cap{font-family:var(--font-mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--color-grey-faint)}.hex{font-family:var(--font-mono);font-size:9.5px;color:var(--color-grey)}.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}.e{display:flex;gap:16px;align-items:flex-end}.ec{width:96px;height:56px;background:var(--surface-card);border:1px solid var(--border-strong)}</style>
</head><body><div class="e">
<div><div class="ec" style="border-radius:2px"></div><p class="cap" style="margin-top:6px">2px · card, btn, input</p></div>
<div><div class="ec" style="border-radius:0"></div><p class="cap" style="margin-top:6px">0 · drawer slips, scrollbar</p></div>
<div><div class="ec" style="border-radius:2px 2px 2px 2px;border-left-width:9px;border-left-color:var(--color-ink2)"></div><p class="cap" style="margin-top:6px">a tome's spine, 9px</p></div>
<div><span class="card-color-choice" style="background:var(--surface-card-amber);display:inline-block"></span><p class="cap" style="margin-top:6px">the one round thing:<br>a colour swatch</p></div>
</div>
<p class="cap" style="margin-top:10px">A build test fails if any theme grows a radius past 2px or reintroduces a blur.</p></body></html>
