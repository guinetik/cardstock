<!-- @dsCard group="Type" viewport="700x200" name="The margin hands" subtitle="Mono caps, tracked wide, written small in the margin" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:14px 18px;background:var(--surface-page);color:var(--color-ink)}.cap{font-family:var(--font-mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--color-grey-faint)}.hex{font-family:var(--font-mono);font-size:9.5px;color:var(--color-grey)}.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}.g{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px 14px;align-items:center;font-size:11px}</style>
</head><body><div class="g">
<span class="hex">.eyebrow · 10px/.11em</span><span class="eyebrow">Demo · Epic Cockpit</span>
<span class="hex">.field-label · 9.5px/.11em</span><span class="field-label">Status &nbsp; Waiting &nbsp; Dates &nbsp; Tags</span>
<span class="hex">.stat · 10px/.09em</span><span><span class="stat stat--wip">wip</span></span>
<span class="hex">legend · 10px/.11em</span><span><fieldset class="fieldset" style="display:inline-flex"><legend>Priority</legend><span class="sq sq--on sq--red">P1</span><span class="sq">P2</span></fieldset></span>
<span class="hex">.lane-name · 20px/.06em</span><span class="lane-name">Nice-to-have</span>
<span class="hex">.folder-stamp · 11px/.16em</span><span><span class="folder-stamp">13 cards<br>filed</span></span>
</div></body></html>
