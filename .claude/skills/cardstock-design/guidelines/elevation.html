<!-- @dsCard group="Brand" viewport="700x180" name="Elevation" subtitle="Four heights, all contact shadows, never a glow" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:14px 18px;background:var(--surface-page);color:var(--color-ink)}.cap{font-family:var(--font-mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--color-grey-faint)}.hex{font-family:var(--font-mono);font-size:9.5px;color:var(--color-grey)}.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}.el{display:flex;gap:18px;align-items:flex-start;padding:6px 4px 16px}.ec{width:118px;padding:12px 10px;background:var(--surface-card);border:1px solid var(--border-hairline);border-radius:var(--radius-card);font-size:11px;color:var(--color-ink2)}</style>
</head><body><div class="el">
<div><div class="ec" style="box-shadow:none">flat in the well</div><p class="cap" style="margin-top:8px">(none)</p></div>
<div><div class="ec" style="box-shadow:var(--shadow-card)">resting on the lane</div><p class="cap" style="margin-top:8px">--shadow-card</p></div>
<div><div class="ec" style="box-shadow:var(--shadow-lift);border-color:var(--border-strong)">pointed at, pinned</div><p class="cap" style="margin-top:8px">--shadow-lift</p></div>
<div><div class="ec" style="box-shadow:var(--shadow-hand);border-color:var(--border-strong);rotate:-0.7deg">in hand</div><p class="cap" style="margin-top:8px">--shadow-hand</p></div>
<div><div class="ec" style="background:var(--surface-well);box-shadow:var(--shadow-well)">cut into the desk</div><p class="cap" style="margin-top:8px">--shadow-well (inset)</p></div>
</div></body></html>
