<!-- @dsCard group="Components" viewport="700x150" name="Icon" subtitle="Lucide glyphs, masked with currentColor" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:18px 20px;background:var(--surface-page)}.row{display:flex;flex-wrap:wrap;gap:18px 26px;align-items:center}.cell{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--color-ink)}.cap{font-family:var(--font-mono);font-size:9px;letter-spacing:.06em;color:var(--color-grey-faint)}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const { Icon, Stat } = window.CardstockDesignSystem_acd70a;
const NAMES = ["book","calendar-clock","pin","pin-off","maximize-2","palette","grip-vertical","plus","minus","more-horizontal","settings","download","upload","gauge","trash-2","pencil","arrow-left","arrow-right","paperclip"];
function Card(){return (
  <div>
    <div className="row">
      {NAMES.map(n => <span key={n} className="cell"><Icon name={n} size={18} /><span className="cap">{n}</span></span>)}
    </div>
    <div className="row" style={{marginTop:16,gap:20}}>
      <Stat tone="wip"><Icon name="calendar-clock" size={12} style={{marginRight:2}} />wip</Stat>
      <span style={{display:"flex",alignItems:"center",gap:5,color:"var(--pen-red)",fontSize:13}}><Icon name="pin" size={14} />pen red</span>
      <span style={{display:"flex",alignItems:"center",gap:5,color:"var(--color-grey)",fontSize:13}}><Icon name="book" size={14} />grey</span>
    </div>
  </div>
);}
ReactDOM.createRoot(document.getElementById("root")).render(<Card />);
</script></body></html>
